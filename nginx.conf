# ─── sysmon nginx config ──────────────────────────────────────────────────────
#
# Place this file at:  /etc/nginx/sites-available/sysmon
# Then enable it:      sudo ln -s /etc/nginx/sites-available/sysmon /etc/nginx/sites-enabled/
#                      sudo nginx -t && sudo systemctl reload nginx
#
# OPTION A — Let's Encrypt (you have a public domain)
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com
#   Certbot will auto-fill the ssl_certificate lines and set up auto-renewal.
#
# OPTION B — Self-signed cert (internal/LAN use, no public domain)
#   sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#        -keyout /etc/ssl/private/sysmon.key \
#        -out    /etc/ssl/certs/sysmon.crt   \
#        -subj   "/CN=sysmon"
#   Then use the paths below as-is.
# ──────────────────────────────────────────────────────────────────────────────

# Redirect all plain HTTP → HTTPS
server {
    listen 80;
    server_name _;               # replace _ with your domain if you have one

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;               # replace _ with your domain if you have one

    # ── Certificates ────────────────────────────────────────────────────────
    # Option A (Let's Encrypt — certbot fills these in automatically):
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Option B (self-signed):
    ssl_certificate     /etc/ssl/certs/sysmon.crt;
    ssl_certificate_key /etc/ssl/private/sysmon.key;

    # ── Strong TLS settings ─────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;

    # ── Security headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;

    # ── Proxy to Flask ──────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Pass real client IP so app.py's client_ip() stays accurate
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Needed for the 10-second dashboard polling — prevent nginx from
        # cutting connections before the poll response arrives
        proxy_read_timeout 30s;
    }
}